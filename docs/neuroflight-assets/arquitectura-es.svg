<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Cómo se organiza el simulador</title><desc id="desc">DEL ESCENARIO AL RESULTADO: MISIÓN, CONTROL DE POSICIÓN, CONTROL DE ACTITUD, MODELO 6DOF; Estado y observaciones. Expertos PD  →  demostraciones simuladas  →  MLP / GRU / LSTM.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#567163"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f4f5ef"/><g font-family="Segoe UI,Arial,sans-serif"><text x="55" y="55" font-size="14" font-weight="700" letter-spacing="2" fill="#a14d32">DEL ESCENARIO AL RESULTADO</text><text x="55" y="97" font-size="32" font-weight="700" fill="#18372e">Cómo se organiza el simulador</text><rect x="55" y="130" width="1090" height="75" rx="12" fill="#17382e"/><text x="78" y="160" fill="#c6d9c8" font-size="12" font-weight="700" letter-spacing="1.5">NEUROFLIGHT</text><text x="78" y="185" fill="white" font-size="18">Interfaz local · misiones · comparación · análisis</text><g fill="#fff" stroke="#c7d4c8" stroke-width="1.5"><rect x="55" y="260" width="236" height="130" rx="12"/><rect x="340" y="260" width="236" height="130" rx="12"/><rect x="625" y="260" width="236" height="130" rx="12"/><rect x="910" y="260" width="235" height="130" rx="12"/></g><g fill="#ab5132" font-size="12" font-weight="700" letter-spacing="1"><text x="75" y="291">01 / MISIÓN</text><text x="360" y="291">02 / CONTROL DE POSICIÓN</text><text x="645" y="291">03 / CONTROL DE ACTITUD</text><text x="930" y="291">04 / MODELO 6DOF</text></g><g fill="#18372e" font-size="17"><text x="75" y="326">Trayectoria, vehículo</text><text x="75" y="354">y perturbaciones</text><text x="360" y="326">PD o red neuronal</text><text x="360" y="354">Fuerza deseada</text><text x="645" y="326">Estabilización clásica</text><text x="645" y="354">Empuje y momentos</text><text x="93