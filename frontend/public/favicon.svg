<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="droneGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7" />
      <stop offset="1" stop-color="#0369A1" />
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="32" cy="32" r="30" fill="#0F172A" />

  <!-- Diagonal Carbon Arms -->
  <line x1="16" y1="16" x2="48" y2="48" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" />
  <line x1="48" y1="16" x2="16" y2="48" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" />

  <!-- Rotor Rings -->
  <circle cx="16" cy="16" r="9" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 2" fill="#0284C7" fill-opacity="0.3" />
  <circle cx="48" cy="16" r="9" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 2" fill="#0284C7" fill-opacity="0.3" />
  <circle cx="16" cy="48" r="9" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 2" fill="#0284C7" fill-opacity="0.3" />
  <circle cx="48" cy="48" r="9" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 2" fill="#0284C7" fill-opacity="0.3" />

  <!-- Motor Nacelles -->
  <circle cx="16" cy="16" r="3.5" fill="#E0F2FE" />
  <circle cx="48" cy="16" r="3.5" fill="#E0F2FE" />
  <circle cx="16" cy="48" r="3.5" fill="#E0F2FE" />
  <circle cx="48" cy="48" r="3.5" fill="#E0F2FE" />

  <!-- Central Avionics Core -->
  <circle cx="32" cy="32" r="8" fill="url(#droneGrad)" stroke="#38BDF8" stroke-width="2" />
  <!-- Forward Heading Indicator -->
  <polygon points="32,21 35.5,28 28.5,28" fill="#38BDF8" />
</svg>
